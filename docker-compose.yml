name: ${COMPOSE_PROJECT_NAME:-sbs-service-knowledge-os}

x-app-common: &app-common
  image: ${APP_IMAGE:-sbs-service-knowledge-os}:${APP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    LLAMA_CLOUD_API_KEY_FILE: /run/secrets/llama_cloud_api_key
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: ${POSTGRES_DB:-sbs_knowledge_os}
    DATABASE_USER: ${POSTGRES_USER:-sbs_app}
    DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    QDRANT_URL: http://qdrant:6333
  secrets:
    - openai_api_key
    - llama_cloud_api_key
    - postgres_password
  expose:
    - "8501"
  networks:
    - backend
    - proxy
  depends_on:
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:size=2G,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"
    interval: 15s
    timeout: 5s
    start_period: 45s
    retries: 5

services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.traefik.address=:8080
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --accesslog.format=json
      - --log.format=json
      - --log.level=INFO
      - --ping=true
      - --ping.entrypoint=traefik
    ports:
      - target: 80
        published: "80"
        protocol: tcp
        mode: host
      - target: 443
        published: "443"
        protocol: tcp
        mode: host
    volumes:
      - ./ops/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - proxy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  app-blue:
    <<: *app-common

  app-green:
    <<: *app-common

  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbs_knowledge_os}
      POSTGRES_USER: ${POSTGRES_USER:-sbs_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-2GB}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=1000
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./data/postgres}
        target: /var/lib/postgresql/data
    networks:
      - backend
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbs_app} -d ${POSTGRES_DB:-sbs_knowledge_os}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__ENABLE_CORS: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - type: bind
        source: ${QDRANT_DATA_DIR:-./data/qdrant}
        target: /qdrant/storage
    expose:
      - "6333"
      - "6334"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ':> /dev/tcp/127.0.0.1/6333'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    image: sbs-service-knowledge-os-backup:local
    restart: unless-stopped
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-sbs_knowledge_os}
      POSTGRES_USER: ${POSTGRES_USER:-sbs_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
    secrets:
      - postgres_password
      - restic_password
      - s3_access_key_id
      - s3_secret_access_key
    volumes:
      - type: bind
        source: ${BACKUP_WORK_DIR:-./backups}
        target: /var/backups/postgres
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  proxy:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  traefik_letsencrypt:

secrets:
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE:-./secrets/openai_api_key}
  llama_cloud_api_key:
    file: ${LLAMA_CLOUD_API_KEY_FILE:-./secrets/llama_cloud_api_key}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  restic_password:
    file: ${RESTIC_PASSWORD_FILE:-./secrets/restic_password}
  s3_access_key_id:
    file: ${S3_ACCESS_KEY_ID_FILE:-./secrets/s3_access_key_id}
  s3_secret_access_key:
    file: ${S3_SECRET_ACCESS_KEY_FILE:-./secrets/s3_secret_access_key}
